[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
fs_permissions = [{ access = "read-write", path = "./leafs"}]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[lint]
# asm-keccak256: suggests rewriting keccak256(abi.encode(...)) in inline assembly
# for marginal gas savings. Disabled because readability matters more here and
# the compiler-generated MCOPY path is correct and auditable without assembly.
exclude_lints = ["asm-keccak256"]
